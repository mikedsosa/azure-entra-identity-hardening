name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow never deploys anything.
permissions:
  contents: read

jobs:
  terraform-static-checks:
    name: fmt / validate / tflint / checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.17"

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend, no credentials)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v6

      - name: tflint
        run: |
          tflint --init
          tflint --format compact
        env:
          # Avoids GitHub API rate limits when tflint downloads the azurerm plugin.
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: checkov
        run: |
          pip install --quiet checkov
          checkov -d . --framework terraform --compact --quiet

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan full history, not just the last commit

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: gitleaks (full git history)
        run: gitleaks git --redact --verbose --exit-code 1 .
